name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, types, tests, build
    runs-on: ubuntu-latest
    env:
      # imlostincode's docs loader reads public repos from the GitHub API
      # during astro check and build. The token only lifts the rate limit
      # (60 requests/hour per runner IP without it).
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Type-check (tsc + astro check)
        run: npm run check

      - name: Tests
        run: npm test

      # Each site's build also runs astro check; @nickmous/astro-i18n fails the
      # build on missing or mistyped translation keys (wired up in #7).
      - name: Build all sites
        run: npm run build

      # Flux applies these; catching a broken overlay here beats a red
      # Kustomization in the cluster.
      - name: Render Kubernetes overlays
        run: |
          for dir in k8s/*/production; do
            echo "::group::$dir"
            kubectl kustomize "$dir" > /dev/null
            echo "::endgroup::"
          done

  api:
    name: API (lint, PHPStan, PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      # Functional tests use a real database; doctrine adds the _test suffix.
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_pgsql
          coverage: none

      - uses: actions/cache@v5
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('api/composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint container and config
        run: |
          php bin/console lint:container
          php bin/console lint:yaml config

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # Migrations, not schema:create: the tests run against exactly what
      # production runs, and a mapping without a migration fails here.
      - name: Test database
        run: |
          php bin/console doctrine:database:create --env=test
          php bin/console doctrine:migrations:migrate --env=test --no-interaction --allow-no-migration
          php bin/console doctrine:schema:validate --env=test

      - name: PHPUnit
        run: php bin/phpunit
