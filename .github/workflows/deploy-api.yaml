# Production deploy for the nickmous API (api.nickmous.com), from api/.
#
# Triggered by publishing a GitHub release whose tag starts with `api-v`, or
# by hand. Builds one multi-arch php-fpm image; Flux image automation rolls
# k8s/api/production (the kit adds nginx, postgres and the init containers).
#
# Not the kit's reusable workflow: that one always builds ./Dockerfile from
# the repo root, and this app lives in api/. The steps mirror it (per-arch
# buildstage images, then one multi-arch manifest per tag).

name: Deploy API

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release being deployed (e.g. api-v1.0.0)'
        required: true
        default: 'api-v0.0.0-manual'

# A release for another site also starts this workflow (its jobs then skip).
# That run gets a group of its own: GitHub keeps one pending run per group
# and cancels the older one, so a skipped run could otherwise cancel a real
# deploy that is waiting its turn.
concurrency:
  group: >-
    ${{ (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'api-v'))
    && 'deploy-api' || format('deploy-api-skip-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/nickmous/portfolio-websites

jobs:
  tag:
    if: >-
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'api-v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      # Same scheme as the sites: api-<YYYYMMDD>-<HHMM>-<release>. The
      # ImagePolicy sorts on the timestamp.
      - id: v
        env:
          MANUAL: ${{ github.event.inputs.version }}
          REF: ${{ github.ref_name }}
        run: |
          slug=$(printf '%s' "${MANUAL:-$REF}" | sed 's/[^A-Za-z0-9._-]/-/g' | cut -c1-80)
          echo "version=api-$(date -u +%Y%m%d-%H%M)-$slug" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: tag
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The version goes last in the scaffolding tag, so the ImagePolicy
      # (anchored on ^api-) never picks a single-arch image.
      - uses: docker/build-push-action@v7
        with:
          context: api
          file: api/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:buildstage-${{ matrix.arch }}-${{ needs.tag.outputs.version }}
          build-args: |
            SENTRY_RELEASE=${{ needs.tag.outputs.version }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-api-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-api-${{ matrix.arch }},mode=max,ignore-error=true

  publish:
    name: Publish
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment:
      name: nickmous-api
      url: https://api.nickmous.com/api
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create multi-arch manifests
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          for tag in "$VERSION" api-latest; do
            docker buildx imagetools create -t "$IMAGE:$tag" \
              "$IMAGE:buildstage-amd64-$VERSION" \
              "$IMAGE:buildstage-arm64-$VERSION"
          done
          docker buildx imagetools inspect "$IMAGE:$VERSION"

      - name: Summary
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          {
            echo "### API image built"
            echo ""
            echo "**Image:** \`$IMAGE:$VERSION\`"
            echo ""
            echo "Flux image automation picks up the new tag and updates the cluster."
          } >> "$GITHUB_STEP_SUMMARY"
