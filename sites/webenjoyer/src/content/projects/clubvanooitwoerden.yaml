oneLiner:
  en: A site for a Woerden local history club, with every presentation and collector card in one place.
  nl: Een site voor een Woerdense historische club, met alle presentaties en verzamelkaarten op één plek.
type:
  en: Club site with CMS
  nl: Verenigingssite met CMS
intro:
  en: The place to see what the next presentation is about, and to look back at the ones before.
  nl: De plek om te zien waar de volgende presentatie over gaat, en om terug te kijken naar de vorige.
whatItIs:
  en: Stichting Club van Ooit has been around since 1996 and hosts free afternoon presentations about the history of Woerden, from September to April. Visitors come to see what's next, where and when, and to find the collector card that belongs to each presentation.
  nl: Stichting Club van Ooit bestaat sinds 1996 en organiseert gratis middagpresentaties over de geschiedenis van Woerden, van september tot april. Bezoekers komen kijken wat er als volgende op het programma staat, waar en wanneer, en zoeken de verzamelkaart die bij elke presentatie hoort.
whatIBuilt:
  - en: The club edits everything itself in Directus, with a live preview of drafts before they go online
    nl: De club beheert alles zelf in Directus, met een live preview van concepten voordat ze online gaan
  - en: A collector card per presentation, both sides scanned, that only appears once it's been handed out
    nl: Een verzamelkaart per presentatie, beide kanten gescand, die pas verschijnt als hij is uitgedeeld
  - en: Presentations grouped by season, with the next one front and centre on the homepage
    nl: Presentaties per seizoen, met de eerstvolgende vooraan op de homepage
  - en: Structured data, so search engines see every presentation as an event
    nl: Gestructureerde data, zodat zoekmachines elke presentatie als evenement zien
