whatIBuilt:
  - en: A contact form that asks for the room, date and times, and sends the customer a confirmation
    nl: Een contactformulier dat vraagt naar zaal, datum en tijden, en de klant een bevestiging stuurt
  - en: One app that also runs the wedding and meeting-room sites, each on its own domain
    nl: Eén app die ook de trouw- en vergaderzaalsites draait, elk op een eigen domein
  - en: A backoffice for the venue, plus a vacancies page and a holiday notice
    nl: Een backoffice voor het zalencentrum, plus een vacaturepagina en een vakantiemelding
  - en: Spam protection on the form, with a honeypot that bots fall for
    nl: Spambescherming op het formulier, met een honeypot waar bots in trappen
