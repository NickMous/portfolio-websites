apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-http
  labels:
    app.kubernetes.io/component: ingress
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`webenjoyer.nl`) || Host(`www.webenjoyer.nl`)
      kind: Rule
      services:
        - name: app
          port: 80
      middlewares:
        - name: redirect-to-https
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-https
  labels:
    app.kubernetes.io/component: ingress
spec:
  entryPoints:
    - websecure
  routes:
    # www is redirected after TLS, so the certificate covers both names.
    - match: Host(`www.webenjoyer.nl`)
      kind: Rule
      priority: 20
      services:
        - name: app
          port: 80
      middlewares:
        - name: redirect-www-to-apex
    - match: Host(`webenjoyer.nl`)
      kind: Rule
      priority: 10
      services:
        - name: app
          port: 80
  tls:
    secretName: webenjoyer-nl-tls
