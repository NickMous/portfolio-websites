apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-http
  labels:
    app.kubernetes.io/component: ingress
spec:
  entryPoints:
    - web
  routes:
    # ACME HTTP-01 challenges must not be redirected to https, so they get
    # their own higher-priority rule. The parentheses matter: && binds
    # tighter than ||.
    - match: (Host(`sanderdh.com`) || Host(`www.sanderdh.com`)) && PathPrefix(`/.well-known/acme-challenge`)
      kind: Rule
      priority: 100
      services:
        - name: app
          port: 80
    - match: Host(`sanderdh.com`) || Host(`www.sanderdh.com`)
      kind: Rule
      priority: 10
      services:
        - name: app
          port: 80
      middlewares:
        - name: redirect-to-https
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-https
  labels:
    app.kubernetes.io/component: ingress
spec:
  entryPoints:
    - websecure
  routes:
    # www is redirected after TLS, so the certificate covers both names.
    - match: Host(`www.sanderdh.com`)
      kind: Rule
      priority: 20
      services:
        - name: app
          port: 80
      middlewares:
        - name: redirect-www-to-apex
    - match: Host(`sanderdh.com`)
      kind: Rule
      priority: 10
      services:
        - name: app
          port: 80
  tls:
    secretName: sanderdh-en-tls
