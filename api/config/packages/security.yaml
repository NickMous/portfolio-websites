security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # One account: Sander. The hash comes from the environment (app-secret
        # in production); make one with `php bin/console security:hash-password`.
        admin:
            memory:
                users:
                    admin: { password: '%env(ADMIN_PASSWORD_HASH)%', roles: ['ROLE_ADMIN'] }

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        # The backoffice is the only part with a login (and a session).
        admin:
            pattern: ^/(admin|login|logout)
            provider: admin
            form_login:
                login_path: login
                check_path: login
                enable_csrf: true
                default_target_path: admin
            logout:
                path: logout
                target: login
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
        # The public API and the signed guestbook links need no login.
        main:
            security: false

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
