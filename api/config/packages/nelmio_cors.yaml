# Only the nickmous sites call this API from a browser. CORS_ALLOW_ORIGIN is a
# regex: production sets it to the two domains (k8s/api), dev allows localhost.
nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'POST', 'OPTIONS']
        allow_headers: ['Content-Type']
        max_age: 3600
    paths:
        '^/': null
